name: Real - Estate Parallel Test Build

on:
  workflow_dispatch:
  # start a run manually from the Actions tab
  pull_request:
    types: [opened, reopened, edited, synchronize]
  # runs on every PR event
  push:
    branches: [main]
  # runs on every push to main

jobs:
  cypress-parallel-e2e:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.0

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-cache-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-cache-

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress E2E tests in parallel
        env:
          USER_EMAIL: ${{ secrets.USER_EMAIL }}
          # USER_EMAIL holds the regular user email from the GitHub secret
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          # USER_PASSWORD holds the regular user password from the GitHub secret
          REALTOR_EMAIL: ${{ secrets.REALTOR_EMAIL }}
          # REALTOR_EMAIL holds the realtor email from the GitHub secret
          REALTOR_PASSWORD: ${{ secrets.REALTOR_PASSWORD }}
          # REALTOR_PASSWORD holds the realtor password from the GitHub secret
        run: npm run cy:parallel

      - name: Merge Mochawesome Reports
        run: npm run merge:reports

      - name: Generate HTML Report
        run: npm run generate:report

      - name: Upload HTML Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-html
          path: reports/html/
